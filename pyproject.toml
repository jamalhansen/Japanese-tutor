[project]
name = "japanese-tutor"
version = "0.1.0"
description = "A local-first Japanese tutor with SRS and mnemonic generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "google-genai>=1.65.0",
    "llmwhisperer-client>=0.1.0",
    "local-first-common",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "typer>=0.15.0",
    "pillow>=11.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
japanese-tutor = "japanese_tutor.main:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
